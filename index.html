<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reporting Cargill</title>
<meta name="description" content="Comptes rendus d'intervention et reporting hebdomadaire des work orders.">
<meta name="theme-color" content="#1D3557">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reporting">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : une colonne de travail (680px max), barre navy en haut, actions principales en bas d'écran, gros boutons utilisables avec des gants. */
:root{
  color-scheme: light;
  --bg:#ECEFF3; --card:#FFFFFF; --card2:#F5F7FA; --ink:#132030; --ink2:#2C3B4C; --muted:#5D6D7E; --line:#D4DBE3; --soft:#E5EAF0;
  --navy:#1D3557; --on-navy:#FFFFFF; --on-navy-2:#B7C7DA; --navy-soft:#DCE5F0;
  --amber:#F2A900; --on-amber:#1B1400; --amber-soft:#FFF0C7; --amber-line:#D99A00; --warn-ink:#7A4F00;
  --ok:#2C7A4D; --ok-soft:#DDF0E4; --danger:#B3261E; --on-danger:#FFFFFF; --danger-soft:#FBE3E0;
  --focus:#2F6FDE;
  --shadow:0 1px 2px rgba(19,32,48,.07),0 6px 18px rgba(19,32,48,.06);
  --f-display:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0C1218; --card:#151E28; --card2:#1A2430; --ink:#E7EDF3; --ink2:#C9D3DD; --muted:#8FA0B1; --line:#283646; --soft:#1F2A37;
    --navy:#12263F; --on-navy:#FFFFFF; --on-navy-2:#9DB2CA; --navy-soft:#1A2D45;
    --amber:#F5B52A; --on-amber:#1B1400; --amber-soft:#382C0E; --amber-line:#C99210; --warn-ink:#F7C95C;
    --ok:#62C48E; --ok-soft:#163325; --danger:#FF8F85; --on-danger:#2A0907; --danger-soft:#3B1714;
    --focus:#82B2FF;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0C1218; --card:#151E28; --card2:#1A2430; --ink:#E7EDF3; --ink2:#C9D3DD; --muted:#8FA0B1; --line:#283646; --soft:#1F2A37;
    --navy:#12263F; --on-navy:#FFFFFF; --on-navy-2:#9DB2CA; --navy-soft:#1A2D45;
    --amber:#F5B52A; --on-amber:#1B1400; --amber-soft:#382C0E; --amber-line:#C99210; --warn-ink:#F7C95C;
    --ok:#62C48E; --ok-soft:#163325; --danger:#FF8F85; --on-danger:#2A0907; --danger-soft:#3B1714;
    --focus:#82B2FF;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.4;min-height:100dvh;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
img{max-width:100%;display:block}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
svg.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Barre du haut */
.topbar{position:sticky;top:0;z-index:30;background:var(--navy);color:var(--on-navy);padding-top:env(safe-area-inset-top,0px)}
.topbar-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:60px;padding-left:var(--gl);padding-right:var(--gr)}
.tb-title{flex:1;min-width:0}
.tb-title b{display:block;font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title small{display:block;color:var(--on-navy-2);font-size:13.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:inherit;flex:none}
.icon-btn:active{background:rgba(255,255,255,.12)}

.wrap{max-width:680px;margin:0 auto;padding:16px var(--gr) 136px var(--gl);display:flex;flex-direction:column;gap:16px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;font-weight:600;font-size:16.5px;line-height:1.15;text-align:center;border:1.5px solid transparent;text-decoration:none}
.btn-primary{background:var(--amber);color:var(--on-amber);border-color:var(--amber-line)}
.btn-primary:active{filter:brightness(.94)}
.btn-big{min-height:60px;font-size:18px;width:100%;font-family:var(--f-display);font-weight:700;letter-spacing:.01em;font-size:20px}
.btn-secondary{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn-secondary:active{background:var(--soft)}
.btn-navy{background:var(--navy);color:var(--on-navy)}
.btn-ghost{color:var(--ink2);border-color:transparent;background:transparent}
.btn-danger{color:var(--danger);background:transparent;border-color:var(--line)}
.btn-danger-fill{background:var(--danger);color:var(--on-danger)}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{color:var(--focus);font-weight:600;text-decoration:underline;text-underline-offset:2px;font-size:inherit}

/* Accueil */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.sec-head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.chip-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px;color:var(--ink2)}

/* Semaine */
.week{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.wk-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;width:100%;padding:12px 16px;text-align:left;background:var(--card2);border-bottom:1px solid var(--line)}
.week.current .wk-head{background:var(--navy);color:var(--on-navy);border-bottom-color:transparent}
.wk-no{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;height:58px;border-radius:12px;border:2px solid currentColor;line-height:1}
.wk-no small{font-family:var(--f-display);font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:600;opacity:.8}
.wk-no b{font-family:var(--f-display);font-size:30px;font-weight:700}
.wk-dates{min-width:0;display:flex;flex-direction:column;gap:1px}
.wk-dates small{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--amber)}
.wk-dates b{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.wk-dates span{font-size:14.5px;opacity:.82}
.wk-tot{text-align:right}
.wk-tot b{display:block;font-family:var(--f-mono);font-weight:600;font-size:18px}
.wk-tot span{display:block;font-size:13px;opacity:.78}
.wk-foot{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.wk-foot .btn{flex:1 1 220px}
.sent{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ok);font-weight:600}
.sent svg.ic{width:16px;height:16px}

/* Jour (s'ouvre dans la semaine) */
.day{border-top:1px solid var(--line);scroll-margin-top:84px}
.day:first-child{border-top:0}
.day.open{background:var(--card2)}
.day-head{display:grid;grid-template-columns:minmax(0,1fr) auto 20px;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 16px;text-align:left;cursor:pointer}
.dh-send{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--navy);color:var(--on-navy);font-weight:700;font-size:14px}
.dh-send svg.ic{width:16px;height:16px}
.seg-ctl{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:12px;background:var(--soft)}
.seg-ctl button{min-height:46px;border-radius:9px;font-weight:600;color:var(--ink2)}
.seg-ctl button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.day-head:active{background:var(--soft)}
.dh-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.dh-name b{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:17px;line-height:1.2}
.dh-name small{font-size:14px;color:var(--muted)}
.day.empty .dh-name b{font-weight:600;color:var(--ink2)}
.today-pill{font-family:var(--f-display);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 8px;border-radius:999px;background:var(--amber);color:var(--on-amber)}
.dh-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.dh-right b{font-family:var(--f-mono);font-weight:600;font-size:16px}
.dh-chev{color:var(--muted);display:grid;place-items:center;transition:transform .2s}
.dh-chev svg.ic{width:20px;height:20px}
.day.open .dh-chev{transform:rotate(90deg)}
.st{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st svg.ic{width:14px;height:14px}
.st-ok{background:var(--ok-soft);color:var(--ok)}
.st-todo{background:var(--amber-soft);color:var(--warn-ink)}
.day-body{display:flex;flex-direction:column;gap:10px;padding:0 16px 16px}
.items{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.it{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;padding:12px;text-align:left;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it:active{background:var(--soft)}
.it-time{font-family:var(--f-mono);font-weight:600;font-size:13.5px;color:var(--ink2);padding-top:2px}
.it-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.it-title{font-weight:600;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it-sub{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.it-sub .wo{font-family:var(--f-mono);font-weight:600;color:var(--ink2)}
.it-dur{font-family:var(--f-mono);font-weight:600;font-size:15px;padding-top:1px}

/* Barre d'actions en bas (formulaire) */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 18px rgba(19,32,48,.06)}
.actionbar-in{max-width:680px;margin:0 auto;display:flex;gap:10px;padding:10px var(--gr) 10px var(--gl)}
.actionbar-in .btn{flex:1}
.ab-err{max-width:680px;margin:0 auto;padding:10px var(--gr) 0 var(--gl);color:var(--danger);font-weight:600;font-size:14.5px}

/* Formulaire */
.fsec{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:14px}
.fsec-title{font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.05em;margin:0;display:flex;align-items:center;gap:8px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.lbl{font-family:var(--f-display);font-weight:600;font-size:14.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2)}
.inp,select.inp,textarea.inp{width:100%;min-height:50px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:16.5px}
textarea.inp{min-height:96px;resize:vertical;line-height:1.4}
select.inp{appearance:none;-webkit-appearance:none;padding-right:38px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.inp:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
.inp.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:.03em}
.inp[disabled]{opacity:.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:14px;color:var(--muted);line-height:1.35}
.hint .link{font-size:14px}
.read-tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--ok);margin-left:6px;text-transform:none;letter-spacing:0;font-family:var(--f-body)}
.date-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);text-align:left}
.date-btn b{display:block;font-weight:600;font-size:17px}
.date-btn small{display:block;color:var(--muted);font-size:14px}
.date-btn .ic{color:var(--ink2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card2);font-weight:600;font-size:14.5px;font-family:var(--f-mono);color:var(--ink2)}
.chip.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.chip span{font-family:var(--f-body)}

.wo-drop{border:2px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--card2)}
.wo-drop p{margin:0;font-size:14.5px;color:var(--muted)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row > *{flex:1 1 140px}
.btn-row.stack > *{flex-basis:100%}
.file-chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);min-width:0}
.file-chip .fc-name{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-chip .fc-name small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.file-chip button{font-weight:600;color:var(--focus);font-size:14.5px;padding:6px 4px}
.progress{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--amber);width:0;transition:width .3s}
.progress.indet i{width:35%;animation:indet 1.2s ease-in-out infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.found{display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.found .ok{color:var(--ok);font-weight:600}
.conflict{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 10px;border-radius:8px;background:var(--amber-soft)}
.conflict span{min-width:0;overflow-wrap:anywhere}
.conflict button{flex:none}

.hist{border-radius:10px;background:var(--navy-soft);padding:10px 12px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.hist b{font-weight:700}

.mic-wrap{position:relative}
.mic-wrap textarea{padding-right:64px}
.mic{position:absolute;right:8px;top:8px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:var(--on-navy)}
.mic.on{background:var(--danger);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 45%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
.mic-state{font-size:14px;color:var(--danger);font-weight:600}

.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--soft);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .rm{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:rgba(10,16,24,.7);color:#fff;display:grid;place-items:center}
.ph .rm svg.ic{width:18px;height:18px}
.ph-add{aspect-ratio:1;border-radius:10px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;color:var(--ink2);background:var(--card2);cursor:pointer;max-width:100%}

details.more{border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;font-weight:600;color:var(--ink2);list-style:none;display:flex;align-items:center;gap:8px;min-height:36px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";font-family:var(--f-mono);font-weight:600;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:15px}
details.more[open] summary::before{content:"−"}
details.more .field{margin-top:12px}

.banner{background:var(--amber-soft);border:1.5px solid var(--amber-line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.banner .btn-row .btn{min-height:44px}
.danger-zone{display:flex;justify-content:center}

/* Feuille du bas */
.backdrop{position:fixed;inset:0;background:rgba(8,12,18,.48);z-index:40;opacity:0;transition:opacity .2s}
.backdrop.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:20px 20px 0 0;max-height:92dvh;overflow:auto;transform:translateY(100%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:none}
.sheet-in{max-width:680px;margin:0 auto;padding:10px var(--gr) 20px var(--gl);display:flex;flex-direction:column;gap:14px}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 4px}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sh-head h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.1;text-wrap:balance}
.sh-head p{margin:4px 0 0;color:var(--muted);font-size:15px}
.loading{display:flex;flex-direction:column;gap:10px;padding:10px 0;color:var(--muted)}
.pdf-pages{display:flex;flex-direction:column;gap:12px}
.pdf-pages img{width:100%;border-radius:6px;box-shadow:var(--shadow);background:#fff;border:1px solid var(--line)}

/* Calendrier */
.cal-nav{display:flex;align-items:center;justify-content:space-between}
.cal-nav b{font-family:var(--f-display);font-weight:700;font-size:21px;text-transform:capitalize}
.cal-nav .icon-btn{border:1.5px solid var(--line);color:var(--ink)}
.cal{display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .h{font-family:var(--f-display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 0}
.cal .wn{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:grid;place-items:center}
.cal button.d{position:relative;height:46px;border-radius:10px;font-weight:600;font-size:16.5px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cal button.d.out{color:var(--muted);opacity:.5}
.cal button.d.tdy{box-shadow:inset 0 0 0 2px var(--amber)}
.cal button.d.sel{background:var(--navy);color:var(--on-navy)}
.cal button.d.has::after{content:"";position:absolute;bottom:6px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--amber)}
.cal button.d:active{background:var(--soft)}

/* Réglages */
.set-list{display:flex;flex-direction:column;gap:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.toggle input{width:24px;height:24px;accent-color:var(--navy)}
.small{font-size:13.5px;color:var(--muted)}

/* Toast */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:60;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;font-size:15px;width:max-content;max-width:min(92vw,520px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--danger);color:var(--on-danger)}

@media (min-width:560px){ .today-actions{grid-template-columns:auto auto;justify-content:start} }
@media (max-width:380px){ .row2{grid-template-columns:1fr} .wk-no{min-width:50px;height:52px} .wk-no b{font-size:26px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ==========================================================================
   Reporting Cargill — comptes rendus d'intervention
   Toutes les données restent sur le téléphone (IndexedDB).
   ========================================================================== */

const CONFIG = {
  /* Envoi direct par Gmail (optionnel) : colle ici l'ID client OAuth Google.
     Voir LISEZMOI.md, section « Envoi direct depuis Gmail ». Laisse vide pour
     passer par le partage du téléphone (Gmail avec le PDF déjà joint). */
  googleClientId: ''
};
const APP_VERSION = '1.1';
const PREVIEW = false; // true uniquement pour l'aperçu publié sur Claude
const DEMO_WO_B64 = '';
const LIBS = {
  jspdf: 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
  autotable: 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js',
  pdfjs: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
  pdfjsWorker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
  tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  gis: 'https://accounts.google.com/gsi/client'
};

/* ---------- Petits outils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const plural = (n, one, many) => `${n} ${n > 1 ? many : one}`;
let debTimers = {};
const debounce = (key, fn, ms = 400) => { clearTimeout(debTimers[key]); debTimers[key] = setTimeout(fn, ms); };

const ICONS = {
  back: '<path d="M15 18l-6-6 6-6"/>',
  chev: '<path d="M9 18l6-6-6-6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  cal: '<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>',
  mic: '<rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/>',
  stop: '<rect x="7" y="7" width="10" height="10" rx="1.5"/>',
  cam: '<path d="M4 7.5h3l1.5-2.5h7L17 7.5h3a1 1 0 0 1 1 1V19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8.5a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/>',
  img: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="M21 16l-5-5-9 9"/>',
  file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  send: '<path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/>',
  dl: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  sliders: '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'
};
const ic = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- Dates & heures ---------- */
const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const DAYS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const DAYS_SHORT = ['Dim.', 'Lun.', 'Mar.', 'Mer.', 'Jeu.', 'Ven.', 'Sam.'];
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const todayKey = () => keyOf(new Date());
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear(); const y0 = new Date(Date.UTC(y, 0, 1));
  return { week: Math.ceil(((t - y0) / 864e5 + 1) / 7), year: y };
}
const dnum = d => d.getDate() === 1 ? '1er' : String(d.getDate());
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtLong = d => `${DAYS[d.getDay()]} ${dnum(d)} ${MONTHS[d.getMonth()]}`;
const fmtLongY = d => `${fmtLong(d)} ${d.getFullYear()}`;
const fmtShort = d => `${DAYS_SHORT[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth() + 1)}`;
const fmtNum = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
function weekLabel(mon, withWeekend) {
  const end = addDays(mon, withWeekend ? 6 : 4);
  if (mon.getMonth() === end.getMonth()) return `du ${dnum(mon)} au ${dnum(end)} ${MONTHS[end.getMonth()]} ${end.getFullYear()}`;
  const y1 = mon.getFullYear() !== end.getFullYear() ? ' ' + mon.getFullYear() : '';
  return `du ${dnum(mon)} ${MONTHS[mon.getMonth()]}${y1} au ${dnum(end)} ${MONTHS[end.getMonth()]} ${end.getFullYear()}`;
}
const toMin = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const fmtH = t => { const m = toMin(t); if (m == null) return ''; const h = Math.floor(m / 60), mm = m % 60; return mm ? `${h}h${pad(mm)}` : `${h}h`; };
const fmtRange = (a, b) => a && b ? `${fmtH(a)}–${fmtH(b)}` : a ? `à partir de ${fmtH(a)}` : 'À préciser';
const fmtDur = m => { if (m == null || isNaN(m)) return '—'; const h = Math.floor(m / 60), mm = Math.round(m % 60); return `${h}h${pad(mm)}`; };
const fmtDec = m => m == null ? '' : (m / 60).toFixed(2).replace('.', ',');

/* ---------- Stockage local (IndexedDB) ---------- */
const DB = {
  db: null, mem: { reports: new Map(), files: new Map(), kv: new Map() },
  open() {
    return Promise.race([DB._open(), new Promise(r => setTimeout(() => r(false), 2500))]);
  },
  _open() {
    return new Promise(res => {
      if (!('indexedDB' in window)) return res(false);
      let r;
      try { r = indexedDB.open('reporting-cargill', 1); } catch (e) { return res(false); }
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('reports')) d.createObjectStore('reports', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'k' });
      };
      r.onsuccess = () => { DB.db = r.result; res(true); };
      r.onerror = () => res(false);
    });
  },
  _req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  _st(s, mode = 'readonly') { return DB.db.transaction(s, mode).objectStore(s); },
  all(s) { return DB.db ? DB._req(DB._st(s).getAll()) : Promise.resolve([...DB.mem[s].values()]); },
  get(s, k) { return DB.db ? DB._req(DB._st(s).get(k)) : Promise.resolve(DB.mem[s].get(k)); },
  put(s, v) { if (!DB.db) { DB.mem[s].set(v.id ?? v.k, v); return Promise.resolve(); } return DB._req(DB._st(s, 'readwrite').put(v)); },
  del(s, k) { if (!DB.db) { DB.mem[s].delete(k); return Promise.resolve(); } return DB._req(DB._st(s, 'readwrite').delete(k)); },
  async getKV(k, def) { const r = await DB.get('kv', k); return r ? r.v : def; },
  setKV(k, v) { return DB.put('kv', { k, v }); }
};

/* ---------- État ---------- */
const DEFAULT_SETTINGS = {
  name: 'Dimitri Van Calster', company: 'Cargill', site: '',
  managerName: '', managerEmail: '',
  dayStart: '07:00', dayEnd: '15:00', lunchStart: '12:00', lunchEnd: '13:00',
  pdfPhotos: true, gmailGranted: false, sendMode: 'week'
};
const S = { settings: { ...DEFAULT_SETTINGS }, reports: [], sent: {}, openWeeks: new Set(), openDays: new Set([todayKey()]), extraWeeks: new Set(), focusDay: null, route: null, prevRoute: null, };
const urlCache = new Map();
async function fileURL(id) {
  if (urlCache.has(id)) return urlCache.get(id);
  const rec = await DB.get('files', id); if (!rec) return null;
  const u = URL.createObjectURL(rec.blob); urlCache.set(id, u); return u;
}
const saveSettings = () => debounce('settings', () => DB.setKV('settings', S.settings), 300);

/* ---------- Calculs ---------- */
function autoDuration(start, end) {
  const a = toMin(start), b = toMin(end);
  if (a == null || b == null || b <= a) return null;
  let d = b - a;
  const ls = toMin(S.settings.lunchStart), le = toMin(S.settings.lunchEnd);
  if (ls != null && le != null && le > ls) d -= Math.max(0, Math.min(b, le) - Math.max(a, ls));
  return Math.max(0, d);
}
const lunchOverlap = (start, end) => { const a = toMin(start), b = toMin(end), ls = toMin(S.settings.lunchStart), le = toMin(S.settings.lunchEnd); return a != null && b != null && ls != null && le != null && Math.min(b, le) - Math.max(a, ls) > 0; };
const normWO = s => (s || '').toUpperCase().replace(/^\s*(WO|OT|N°|NO)[\s.:#-]*/, '').replace(/[^A-Z0-9]/g, '');
function cmpReports(a, b) {
  if (a.date !== b.date) return a.date < b.date ? -1 : 1;
  const sa = toMin(a.start) ?? 9999, sb = toMin(b.start) ?? 9999;
  if (sa !== sb) return sa - sb;
  return (a.createdAt || 0) - (b.createdAt || 0);
}
function cumulMap() {
  const by = {}, out = {};
  for (const r of S.reports) { const w = normWO(r.wo); if (w) (by[w] = by[w] || []).push(r); }
  for (const w in by) {
    let run = 0;
    for (const r of by[w].sort(cmpReports)) { run = r.cumulManual != null ? r.cumulManual : run + (r.duration || 0); out[r.id] = run; }
  }
  return out;
}
function woHistory(wo, draft) {
  const w = normWO(wo); if (!w) return null;
  const all = S.reports.filter(r => r.id !== draft.id && normWO(r.wo) === w).sort(cmpReports);
  let prev = 0; const before = [];
  for (const r of all) if (cmpReports(r, draft) < 0) { prev = r.cumulManual != null ? r.cumulManual : prev + (r.duration || 0); before.push(r); }
  return { all, before, prev };
}
const reportsOn = k => S.reports.filter(r => r.date === k).sort(cmpReports);
const sumDur = rs => rs.reduce((s, r) => s + (r.duration || 0), 0);

/* ---------- Interface : toast, feuilles ---------- */
function toast(msg, kind = '') {
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + kind;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = ''; }, kind === 'err' ? 5200 : 3400);
}
function openSheet(html, { onClose } = {}) {
  closeSheet(true);
  const root = $('#sheetRoot');
  root.innerHTML = `<div class="backdrop" data-act="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in"><div class="grab"></div>${html}</div></div>`;
  S.sheetClose = onClose || null;
  requestAnimationFrame(() => { $('.backdrop', root)?.classList.add('show'); $('.sheet', root)?.classList.add('show'); });
  return $('.sheet-in', root);
}
function closeSheet(instant) {
  const root = $('#sheetRoot'); if (!root.firstChild) return;
  const cb = S.sheetClose; S.sheetClose = null;
  if (instant) { root.innerHTML = ''; } else {
    $('.backdrop', root)?.classList.remove('show'); $('.sheet', root)?.classList.remove('show');
    setTimeout(() => { if (!$('.sheet.show', root)) root.innerHTML = ''; }, 260);
  }
  if (cb) cb();
}
function confirmSheet({ title, text, ok = 'Confirmer', danger = false }) {
  return new Promise(res => {
    let done = false;
    const el = openSheet(`<div class="sh-head"><div><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}</div></div>
      <div class="btn-row"><button class="btn btn-secondary" data-r="0">Annuler</button><button class="btn ${danger ? 'btn-danger-fill' : 'btn-primary'}" data-r="1">${esc(ok)}</button></div>`,
      { onClose: () => { if (!done) { done = true; res(false); } } });
    $$('[data-r]', el).forEach(b => b.onclick = () => { done = true; res(b.dataset.r === '1'); closeSheet(); });
  });
}

/* ---------- Calendrier ---------- */
function openCalendar(selKey, onPick, title = 'Choisir une date') {
  let cur = fromKey(selKey || todayKey()); cur = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const has = new Set(S.reports.map(r => r.date));
  const el = openSheet(`<div class="sh-head"><h3>${esc(title)}</h3><button class="icon-btn" data-act="sheet-close" aria-label="Fermer">${ic('x')}</button></div><div id="calBox"></div>
    <button class="btn btn-secondary" id="calToday">Aujourd'hui</button>`);
  const draw = () => {
    const first = mondayOf(cur); const tk = todayKey();
    let h = `<div class="cal-nav"><button class="icon-btn" id="calPrev" aria-label="Mois précédent">${ic('back')}</button><b>${MONTHS[cur.getMonth()]} ${cur.getFullYear()}</b><button class="icon-btn" id="calNext" aria-label="Mois suivant">${ic('chev')}</button></div>
      <div class="cal"><span class="h">S</span>${['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map(d => `<span class="h">${d}</span>`).join('')}`;
    for (let w = 0; w < 6; w++) {
      const mon = addDays(first, w * 7);
      if (w > 3 && mon.getMonth() !== cur.getMonth()) break;
      h += `<span class="wn">${isoWeek(mon).week}</span>`;
      for (let i = 0; i < 7; i++) {
        const d = addDays(mon, i), k = keyOf(d);
        const cls = ['d', d.getMonth() !== cur.getMonth() ? 'out' : '', k === tk ? 'tdy' : '', k === selKey ? 'sel' : '', has.has(k) ? 'has' : ''].join(' ');
        h += `<button type="button" class="${cls}" data-k="${k}" aria-label="${fmtLongY(d)}">${d.getDate()}</button>`;
      }
    }
    $('#calBox', el).innerHTML = h + '</div>';
    $('#calPrev', el).onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() - 1, 1); draw(); };
    $('#calNext', el).onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); draw(); };
    $$('button.d', el).forEach(b => b.onclick = () => { closeSheet(); onPick(b.dataset.k); });
  };
  $('#calToday', el).onclick = () => { closeSheet(); onPick(todayKey()); };
  draw();
}

/* ---------- Navigation ---------- */
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?'); const parts = path.split('/');
  const q = new URLSearchParams(qs || '');
  if (parts[0] === 'jour' && /^\d{4}-\d{2}-\d{2}$/.test(parts[1] || '')) return { name: 'day', date: parts[1] };
  if (parts[0] === 'cr' && parts[1] === 'nouveau') return { name: 'form', id: null, date: q.get('date') };
  if (parts[0] === 'cr' && parts[1]) return { name: 'form', id: parts[1] };
  if (parts[0] === 'reglages') return { name: 'settings' };
  return { name: 'home' };
}
const go = h => { history.pushState({ inApp: true }, '', '#/' + h); route(); };
const replaceTo = h => { history.replaceState({ inApp: !!(history.state && history.state.inApp) }, '', '#/' + h); route(); };
const canGoBack = () => !!(history.state && history.state.inApp);
function back(fallback) { if (canGoBack()) history.back(); else replaceTo(fallback); }
window.addEventListener('popstate', () => route());
function route() {
  closeSheet(true); stopMic();
  const r = parseRoute();
  S.prevRoute = S.route; S.route = r;
  window.scrollTo(0, 0);
  if (r.name === 'day') { focusDay(r.date); renderHome(); }
  else if (r.name === 'form') renderForm(r);
  else if (r.name === 'settings') renderSettings();
  else renderHome();
}

/* ---------- Accueil : semaines et jours ---------- */
function sentBadge(key) {
  const s = S.sent[key]; if (!s) return '';
  const d = new Date(s.at);
  return `<span class="sent">${ic('check')} ${s.how === 'gmail' ? 'Envoyé' : 'Partagé'} le ${pad(d.getDate())}/${pad(d.getMonth() + 1)} à ${pad(d.getHours())}h${pad(d.getMinutes())}</span>`;
}
function dayStatus(k, rs, open) {
  if (!rs.length) return '';
  const s = S.sent['day:' + k];
  if (s) return `<span class="st st-ok">${ic('check')} ${s.how === 'gmail' ? 'Envoyé' : 'Partagé'}</span>`;
  if (S.settings.sendMode === 'day' && k <= todayKey() && !open) return `<button type="button" class="dh-send" data-act="export-day" data-k="${k}">${ic('send')} Envoyer</button>`;
  return '';
}
function itemRow(r, cm) {
  const nPh = (r.photos || []).length;
  const sub = [r.wo ? `<span class="wo">WO ${esc(r.wo)}</span>` : '', r.building ? esc(r.building) : '', r.wo ? `cumul ${fmtDur(cm[r.id])}` : '', nPh ? plural(nPh, 'photo', 'photos') : ''].filter(Boolean).join(' · ');
  return `<button class="it" data-act="edit" data-id="${r.id}">
    <span class="it-time">${esc(fmtRange(r.start, r.end))}</span>
    <span class="it-main"><span class="it-title">${esc(r.request || r.comments || 'Intervention')}</span>${sub ? `<span class="it-sub">${sub}</span>` : ''}</span>
    <span class="it-dur">${fmtDur(r.duration)}</span></button>`;
}
function dayBlock(d, cm) {
  const k = keyOf(d), rs = reportsOn(k), open = S.openDays.has(k), isToday = k === todayKey();
  const wos = [...new Set(rs.map(r => r.wo && r.wo.trim()).filter(Boolean))];
  const meta = rs.length ? plural(rs.length, 'intervention', 'interventions') + (wos.length ? ' · WO ' + wos.join(', ') : '') : 'Rien de saisi';
  return `<div class="day ${open ? 'open' : ''} ${rs.length ? '' : 'empty'}" id="day-${k}">
    <div class="day-head" role="button" tabindex="0" data-act="toggle-day" data-k="${k}" aria-expanded="${open}">
      <span class="dh-name"><b>${cap(DAYS[d.getDay()])} ${dnum(d)} ${MONTHS[d.getMonth()]}${isToday ? `<span class="today-pill">Aujourd'hui</span>` : ''}</b><small>${esc(meta)}</small></span>
      <span class="dh-right">${rs.length ? `<b>${fmtDur(sumDur(rs))}</b>` : ''}${dayStatus(k, rs, open)}</span>
      <span class="dh-chev">${ic('chev')}</span>
    </div>
    ${open ? `<div class="day-body">
      ${rs.length ? `<div class="items">${rs.map(r => itemRow(r, cm)).join('')}</div>` : ''}
      <button class="btn btn-primary btn-big" data-act="new" data-k="${k}">${ic('plus')} Créer nouveau compte rendu d'intervention</button>
      ${rs.length ? `<button class="btn btn-secondary" data-act="export-day" data-k="${k}">${ic('send')} Envoyer la journée au n+1 (PDF)</button>` : ''}
    </div>` : ''}
  </div>`;
}
function weekCard(monKey, isCurrent, cm) {
  const mon = fromKey(monKey), wk = isoWeek(mon), sun = keyOf(addDays(mon, 6));
  const days = []; for (let i = 0; i < 7; i++) { const d = addDays(mon, i); if (i < 5 || reportsOn(keyOf(d)).length || keyOf(d) === todayKey()) days.push(d); }
  const weekend = days.some(d => d.getDay() === 0 || d.getDay() === 6);
  const rs = S.reports.filter(r => r.date >= monKey && r.date <= sun);
  const open = isCurrent ? !S.openWeeks.has('!' + monKey) : S.openWeeks.has(monKey);
  return `<section class="week ${isCurrent ? 'current' : ''}">
    <button class="wk-head" data-act="toggle-week" data-k="${monKey}" data-cur="${isCurrent ? 1 : 0}" aria-expanded="${open}">
      <span class="wk-no"><small>Sem.</small><b>${wk.week}</b></span>
      <span class="wk-dates">${isCurrent ? '<small>Cette semaine</small>' : ''}<b>Semaine ${wk.week}</b><span>${weekLabel(mon, weekend)}</span></span>

function bindForm() {
  const f = F;
  const txt = { fWo: 'wo', fBuilding: 'building', fRequest: 'request', fComments: 'comments', fNotif: 'notif', fLocation: 'location', fEquipment: 'equipment' };
  for (const id in txt) {
    const el = $('#' + id);
    el.addEventListener('input', () => {
      f[txt[id]] = el.value;
      if (id === 'fWo') debounce('wo', refreshCalc, 250);
      const rt = $('#rt-' + txt[id]); if (rt) rt.hidden = true;
      scheduleDraft();
    });
  }
  $('#fStart').onchange = e => { f.start = e.target.value; refreshCalc(); markPresets(); scheduleDraft(); };
  $('#fEnd').onchange = e => { f.end = e.target.value; refreshCalc(); markPresets(); scheduleDraft(); };
  $('#fDuration').onchange = e => { f.duration = e.target.value === '' ? null : Number(e.target.value); f.durationManual = true; refreshCalc(); scheduleDraft(); };
  $('#fCumul').onchange = e => {
    const v = e.target.value === '' ? null : Number(e.target.value);
    const h = woHistory(f.wo, f); const auto = (h ? h.prev : 0) + (f.duration || 0);
    f.cumulManual = v === auto ? null : v; refreshCalc(); scheduleDraft();
  };
  $('#woCam').onchange = e => { const file = e.target.files[0]; e.target.value = ''; onWoFile(file); };
  $('#woPick').onchange = e => { const file = e.target.files[0]; e.target.value = ''; onWoFile(file); };
}
function markPresets() { $$('#presets .chip').forEach(c => c.classList.toggle('on', c.dataset.a === F.start && c.dataset.b === F.end)); }

function refreshCalc() {
  const f = F; if (!f || !$('#fDuration')) return;
  if (!f.durationManual) f.duration = autoDuration(f.start, f.end);

  if (f.durationManual) dh.innerHTML = `Temps saisi à la main. <button type="button" class="link" data-act="dur-auto">Recalculer d'après les horaires</button>`;
  else if (f.duration != null) dh.textContent = `Calculé d'après ${fmtRange(f.start, f.end)}${lunchOverlap(f.start, f.end) ? ', pause déduite' : ''}. Tu peux le changer.`;
  else if (f.start && f.end) dh.textContent = "L'heure de fin doit être après le début.";
  else dh.textContent = 'Choisis la fin de l\'intervention, ou le temps passé directement.';

  const hist = woHistory(f.wo, f), cs = $('#fCumul'), ch = $('#cumHint'), wh = $('#woHist');

  }

  if (f.cumulManual != null) ch.innerHTML = `Cumul modifié à la main (calcul auto : ${fmtDur(auto)}). <button type="button" class="link" data-act="cum-auto">Revenir au calcul auto</button>`;
  else if (hist.before.length) ch.textContent = `${fmtDur(hist.prev)} déjà passées sur ce WO (${plural(hist.before.length, 'intervention', 'interventions')}) + ${fmtDur(f.duration || 0)} ici. Si tu y étais allé avant d'utiliser l'appli, corrige le cumul.`;
  else ch.textContent = 'Premier passage enregistré sur ce WO. Si tu y étais déjà intervenu avant, choisis le vrai cumul.';
  if (hist.all.length) {

/* Images */
async function decodeImage(blob) {
  if ('createImageBitmap' in window) { try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch (e) { } }
  return await new Promise((res, rej) => { const u = URL.createObjectURL(blob); const im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('image')); }; im.src = u; });
}
async function drawScaled(blob, max) {
  const im = await decodeImage(blob); const w = im.width || im.naturalWidth, h = im.height || im.naturalHeight;
  const s = Math.min(1, max / Math.max(w, h)); const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(im, 0, 0, c.width, c.height); if (im.close) im.close();
  return c;
}
async function resizeToBlob(blob, max, q) { const c = await drawScaled(blob, max); return await new Promise(r => c.toBlob(b => r(b || blob), 'image/jpeg', q)); }
async function resizeToData(blob, max, q) { const c = await drawScaled(blob, max); return { data: c.toDataURL('image/jpeg', q), w: c.width, h: c.height }; }

async function addPhotos(files) {
  let n = 0;
  for (const file of files) {
    if (file.type && !file.type.startsWith('image/')) continue;
    let blob = file; try { blob = await resizeToBlob(file, 1600, 0.8); } catch (e) { }
    const id = uid(); await DB.put('files', { id, kind: 'photo', type: blob.type || 'image/jpeg', name: file.name || 'photo.jpg', blob, createdAt: Date.now() });
    F.photos.push(id); F.added.push(id); n++;
  }
  if (n) { renderPhotos(); scheduleDraft(); }
  else if (files.length) toast("Ce fichier n'est pas une image lisible.", 'err');
}

function scheduleDraft() { debounce('draft', () => { if (F) DB.setKV('draft', { ...F, savedAt: Date.now() }); }, 500); }

/* ---------- Work order : lecture automatique ---------- */
const scriptLoads = {};
function loadScript(src) {
  if (scriptLoads[src]) return scriptLoads[src];
  scriptLoads[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = () => res(); s.onerror = () => { delete scriptLoads[src]; rej(new Error('Chargement impossible : ' + src)); };
    document.head.appendChild(s);
  });
  return scriptLoads[src];
}
function renderWoStatus(state, p) {
  const box = $('#woStatus'); if (!box) return;
  const f = F;
  const live = $('.loading', box);
  if (state === 'reading' && live && p) { live.firstElementChild.textContent = p.label || 'Lecture du work order…'; const bar = $('.progress', live); if (p.v != null) { bar.classList.remove('indet'); bar.firstElementChild.style.width = Math.round(p.v * 100) + '%'; } return; }
  const chip = async () => {
    if (!f.woFile) return '';
    const rec = await DB.get('files', f.woFile); if (!rec) return '';
    return `<div class="file-chip">${ic('file')}<span class="fc-name">${esc(rec.name)}<small>${rec.type === 'application/pdf' ? 'PDF' : 'Photo'} · ${Math.max(1, Math.round(rec.blob.size / 1024))} Ko</small></span><button type="button" data-act="wo-view">Voir</button><button type="button" data-act="wo-remove">Retirer</button></div>`;
  };
  (async () => {
    let h = await chip();
    if (state === 'reading') {
      h += `<div class="loading"><span>${p && p.label ? esc(p.label) : 'Lecture du work order…'}</span><div class="progress ${p && p.v != null ? '' : 'indet'}"><i style="${p && p.v != null ? `width:${Math.round(p.v * 100)}%` : ''}"></i></div></div>`;
    } else if (state === 'done' && f.woRead) {
      const L = { wo: 'N° WO', notif: "N° d'avis", building: 'Bâtiment', location: 'Localisation', equipment: 'Équipement', request: 'Travail demandé' };
      const { filled, conflicts, extra } = f.woRead;
      h += `<div class="found">`;
      if (filled.length) h += `<span class="ok">${ic('check')} ${plural(filled.length, 'info remplie', 'infos remplies')} : ${filled.map(k => L[k]).join(', ')}. Vérifie d'un coup d'œil.</span>`;
      else if (!conflicts.length) h += `<span>Je n'ai rien pu lire de fiable sur ce document. Le WO reste joint ; remplis les champs à la main.</span>`;
      for (const c of conflicts) h += `<div class="conflict"><span>${L[c.k]} sur le WO : <b>${esc(c.v)}</b></span><button type="button" class="link" data-act="wo-use" data-k="${c.k}">Utiliser</button></div>`;
      if (extra && (extra.priority || extra.requester)) h += `<span class="hint">${extra.priority ? 'Priorité : ' + esc(extra.priority) : ''}${extra.priority && extra.requester ? ' · ' : ''}${extra.requester ? 'Demandeur : ' + esc(extra.requester) : ''}</span>`;
      h += `</div>`;
    } else if (state === 'error') {
      h += `<span class="hint">Lecture impossible (pas de réseau ?). Le WO reste joint ; remplis les champs à la main ou réessaie plus tard. <button type="button" class="link" data-act="wo-reread">Réessayer</button></span>`;
    } else if (state === 'attached') {
      h += `<button type="button" class="link" data-act="wo-reread" style="align-self:flex-start">Relire les infos du WO</button>`;
    }
    box.innerHTML = h;
  })();
}

async function onWoFile(file) {
  if (!file) return;
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');

  async send({ to, subject, text, pdf, filename }) {
